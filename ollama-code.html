<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ollama Code</title>
<style>
:root{--bg:#0a0c10;--p1:#10141a;--p2:#151a22;--p3:#1c232d;--line:#222a35;--tx:#d9e0ea;--dim:#7f8b9a;--ac:#6cb6ff;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
a{color:var(--ac)}
code,pre{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--dim)}.small{font-size:12px}
[hidden]{display:none!important}
.btn{background:var(--p3);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#34404f}
.btn.primary{background:var(--ac);color:#06121f;border-color:var(--ac);font-weight:600}
.btn.ok{background:#14301f;border-color:#1f5a35;color:var(--ok)}
.btn.danger{color:var(--err)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.view{position:absolute;inset:0}
/* connect */
.center{display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#14233a 0,transparent 60%)}
.connect{width:100%;max-width:440px;background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:22px;font-weight:700;letter-spacing:.3px}.logo span{color:var(--ac)}
.connect label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim)}
.connect label em{font-style:normal;opacity:.7}
.connect label.chk{flex-direction:row;align-items:center;gap:8px}
.connect label.chk input{width:auto}
.errbox{background:#2a1416;border:1px solid #5a2327;color:#fda4a4;border-radius:8px;padding:10px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
/* models */
#models{display:flex;flex-direction:column;overflow:auto}
.mh{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--p1);position:sticky;top:0;z-index:2}
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mtools input{width:220px}.mtools select{width:auto}
.chips{display:flex;gap:8px;padding:14px 24px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--p2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.chip.on{background:#12304d;border-color:var(--ac);color:#cfe8ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:18px 24px 40px}
.mcard{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:.12s}
.mcard:hover{border-color:#3a4a5e;transform:translateY(-1px)}
.mcard.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.mtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mname{word-break:break-all}
.run{color:var(--ok);font-size:11.5px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.tag.unk{color:var(--dim)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta span{font-size:11.5px;color:var(--dim);background:var(--p2);padding:1px 7px;border-radius:6px}
/* workspace */
#ws{display:grid;grid-template-columns:240px minmax(0,1fr) 340px}
#ws.wide{grid-template-columns:240px minmax(0,1fr) 560px}
aside{background:var(--p1);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);position:relative}
.sbh{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sess{flex:1;overflow:auto;padding:6px}
.si{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--dim)}
.si:hover{background:var(--p2)}.si.on{background:var(--p3);color:var(--tx)}
.si span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si b{font-weight:400;opacity:0;padding:0 4px}.si:hover b{opacity:.8}
.sbf{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--p1);flex-wrap:wrap}
#top .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#top select{width:auto;padding:5px 8px}
.mchip{display:flex;gap:6px;align-items:center;cursor:pointer;border:1px solid var(--line);background:var(--p2);border-radius:8px;padding:4px 10px;max-width:300px}
.mchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tbtn{display:none}
#chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:auto}
#chat>*{max-width:900px;width:100%;margin:0 auto}
.msg.user{align-self:flex-end;background:var(--p3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.msg.user img{max-height:120px;border-radius:8px;margin:4px 6px 0 0}
.msg.asst{padding:0 2px}
.who{font-size:11.5px;color:var(--ac);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.msg.live .who::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.think{margin:6px 0;border-left:2px solid var(--line);padding-left:10px;color:var(--dim)}
.think summary{cursor:pointer;font-size:12.5px}
.thinkpre{white-space:pre-wrap;font-family:inherit;margin:6px 0;font-size:12.5px}
.md p{margin:.45em 0}.md ul,.md ol{margin:.4em 0;padding-left:22px}
.md h2,.md h3,.md h4,.md h5{margin:.9em 0 .3em}
.md blockquote{margin:.4em 0;padding:0 12px;border-left:3px solid var(--line);color:var(--dim)}
.md code{background:var(--p3);padding:1px 5px;border-radius:5px}
.md pre.code{background:#0d1117;border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:auto}
.md pre.code code{display:block;padding:10px 12px;background:none;white-space:pre}
.lang{display:flex;justify-content:space-between;align-items:center;padding:3px 10px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);font-family:var(--mono)}
.lang button{background:none;border:0;color:var(--dim);cursor:pointer}
.tools{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--p1);overflow:hidden}
.th{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:pointer;font-size:13px;min-width:0}
.th b{font-family:var(--mono);font-weight:600;font-size:12.5px}
.th .tt{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
.st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.st.running{background:var(--warn);animation:pulse 1s infinite}.st.ok{background:var(--ok)}.st.err{background:var(--err)}.st.pending{background:var(--ac)}
.tb{display:none;padding:8px 10px;border-top:1px solid var(--line);gap:8px;flex-direction:column}
.tool.open .tb{display:flex}
.tb pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;background:#0d1117;border-radius:8px;padding:8px}
.tres{color:#aeb8c6}
.diff .del{color:#fca5a5}.diff .add{color:#86efac}
.perm{display:none;gap:8px;align-items:center;flex-wrap:wrap;background:#1a2433;border-radius:8px;padding:8px}
.perm:not(:empty){display:flex}
.sub{display:flex;flex-direction:column;gap:10px;padding-left:10px;border-left:2px solid var(--line)}
.sub:empty{display:none}
.sub .msg.asst{font-size:13px}
.errline{background:#2a1416;border:1px solid #5a2327;color:#fda4a4;border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.note{color:var(--dim);text-align:center;font-size:12.5px}
.empty{text-align:center;margin-top:8vh}
.empty h2{margin:0 0 6px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
/* composer */
#composer{border-top:1px solid var(--line);padding:10px 14px 8px;background:var(--p1)}
.cbox{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
#atts{display:flex;gap:6px;flex-wrap:wrap}
#atts div{position:relative}#atts img{height:48px;border-radius:6px;display:block}
#atts button{position:absolute;top:-6px;right:-6px;border-radius:50%;border:0;width:18px;height:18px;line-height:16px;cursor:pointer;background:var(--err);color:#fff;padding:0}
.crow{display:flex;gap:8px;align-items:flex-end}
#inp{resize:none;max-height:200px;min-height:42px;flex:1}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--p2);border-radius:999px;padding:2px 12px;cursor:pointer;font-size:12.5px}
.pill.on{background:#12304d;border-color:var(--ac);color:#cfe8ff}
.status{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.status .warn{color:var(--warn)}
/* right panel */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.rbody{flex:1;overflow:auto;min-height:0}
.ftools{display:flex;gap:6px;padding:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tree{padding:6px 0;font-size:13px;font-family:var(--mono)}
.tree summary,.fi{cursor:pointer;padding:2px 8px;color:var(--dim);list-style:none}
.tree summary::-webkit-details-marker{display:none}
.fi{color:var(--tx)}.fi:hover,.tree summary:hover{background:var(--p2)}.fi.sel{background:#12304d}
.todo{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.todo.completed{color:var(--dim);text-decoration:line-through}.todo.in_progress{color:var(--warn)}
#viewer{position:absolute;inset:0;background:var(--p1);display:flex;flex-direction:column;z-index:3}
.vh{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
#ved{flex:1;border:0;border-radius:0;font-family:var(--mono);font-size:12.5px;resize:none;white-space:pre;tab-size:2}
#vpv{flex:1;border:0;background:#fff;width:100%}
/* modal */
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--p1);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{display:flex;gap:5px;align-items:center;color:var(--tx);font-size:12.5px}.checks input{width:auto}
.arow{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.arow div{flex:1;min-width:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--line);padding:8px 16px;border-radius:10px;z-index:99}
@media(max-width:1000px){
  #ws,#ws.wide{grid-template-columns:minmax(0,1fr)}
  #left,#right{position:fixed;top:0;bottom:0;z-index:20;width:min(86vw,360px);transform:translateX(-105%);transition:.2s}
  #right{right:0;left:auto;transform:translateX(105%)}
  #left.open{transform:none}#right.open{transform:none}
  .tbtn{display:inline-block}
}
</style>
</head>
<body>

<section id="connect" class="view center">
  <form class="connect" id="cform">
    <div class="logo"><span>◆</span> Ollama Code</div>
    <div class="dim">Connect to an Ollama API. The key is optional and stays in this browser.</div>
    <label>API URL<input id="c-url" placeholder="http://localhost:11434" autocomplete="url" required></label>
    <label>API key <em>(optional)</em><input id="c-key" type="password" placeholder="Leave empty if not required" autocomplete="off"></label>
    <div id="c-recent" class="chips" style="padding:0" hidden></div>
    <label class="chk"><input type="checkbox" id="c-rem" checked> Also remember the API key on this device</label>
    <button class="btn primary" id="c-go" type="submit">Connect and load models</button>
    <div id="c-err" class="errbox" hidden></div>
  </form>
</section>

<section id="models" class="view" hidden>
  <div class="mh">
    <div><b style="font-size:18px">Models</b> <span class="dim" id="m-count"></span><div class="dim small" id="m-srv"></div></div>
    <div class="mtools">
      <input id="m-q" placeholder="Search models...">
      <select id="m-sort">
        <option value="modified">Newest</option><option value="name">Name</option>
        <option value="size">Size (small first)</option><option value="sizedesc">Size (large first)</option><option value="params">Parameters</option>
      </select>
      <button class="btn" id="m-refresh">Refresh</button>
      <button class="btn" id="m-back" hidden>Back to workspace</button>
      <button class="btn danger" id="m-disc">Disconnect</button>
    </div>
  </div>
  <div class="chips" id="m-chips"></div>
  <div class="grid" id="m-grid"></div>
</section>

<section id="ws" class="view" hidden>
  <aside id="left">
    <div class="sbh">
      <div class="logo" style="font-size:16px"><span>◆</span> Ollama Code</div>
      <button class="btn primary" id="b-new">+ New session</button>
    </div>
    <div class="sess" id="sess"></div>
    <div class="sbf">
      <div class="dim" id="srv" style="word-break:break-all"></div>
      <div style="display:flex;gap:6px"><button class="btn sm" id="b-models">Models</button><button class="btn sm" id="b-agents">Agents</button><button class="btn sm" id="b-set">Settings</button></div>
    </div>
  </aside>
  <main>
    <div id="top">
      <button class="btn sm tbtn" id="t-left">☰</button>
      <div class="grow" id="title">New session</div>
      <div class="mchip" id="mchip" title="Change model"></div>
      <select id="perm" title="Permissions for edits and code execution">
        <option value="ask">Ask before changes</option><option value="edits">Auto-accept edits</option><option value="auto">Auto-accept all</option>
      </select>
      <button class="btn sm tbtn" id="t-right">Files</button>
    </div>
    <div id="chat"></div>
    <div id="composer"><div class="cbox">
      <div id="atts"></div>
      <div class="crow">
        <button class="btn" id="b-att" title="Attach image (vision models)" hidden>＋</button>
        <textarea id="inp" rows="1" placeholder="Ask the agent to build something...   (Enter to send, Shift+Enter for newline, Tab switches agent, / for commands)"></textarea>
        <button class="btn primary" id="b-send">Send</button>
        <button class="btn danger" id="b-stop" hidden>Stop</button>
      </div>
      <div class="pills" id="pills"></div>
      <div class="status"><span id="st-l"></span><span id="st-r"></span></div>
      <input type="file" id="f-img" accept="image/*" multiple hidden>
    </div></div>
  </main>
  <aside id="right">
    <div class="tabs"><button id="tab-files" class="on">Files</button><button id="tab-todos">Todos</button></div>
    <div id="p-files" class="rbody">
      <div class="ftools">
        <button class="btn sm" id="f-new">New file</button>
        <button class="btn sm" id="f-up">Upload</button>
        <button class="btn sm" id="f-open">Open folder</button>
        <button class="btn sm" id="f-virt" hidden>Browser workspace</button>
        <button class="btn sm" id="f-ref">Refresh</button>
        <input type="file" id="f-in" multiple hidden>
      </div>
      <div class="dim small" id="fs-label" style="padding:6px 10px"></div>
      <div id="tree"></div>
    </div>
    <div id="p-todos" class="rbody" hidden></div>
    <div id="viewer" hidden>
      <div class="vh"><b id="v-name"></b>
        <button class="btn sm" id="v-prev" hidden>Preview</button>
        <button class="btn sm" id="v-tab" hidden>New tab</button>
        <button class="btn sm" id="v-dl">Download</button>
        <button class="btn sm primary" id="v-save">Save</button>
        <button class="btn sm" id="v-close">Close</button>
      </div>
      <textarea id="ved" spellcheck="false"></textarea>
      <iframe id="vpv" hidden sandbox="allow-scripts allow-modals allow-forms allow-pointer-lock"></iframe>
    </div>
  </aside>
</section>

<script>
'use strict';
/* ============================ utils ============================ */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('oc.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('oc.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('oc.' + k); } catch {} },
};
function toast(t) { const e = h('div', { class: 'toast' }, t); document.body.append(e); setTimeout(() => e.remove(), 2600); }
const gb = n => (n / 1e9).toFixed(1) + ' GB';
const kfmt = n => n >= 1e6 ? (n / 1048576).toFixed(0) + 'M' : n >= 1000 ? Math.round(n / 1024) + 'k' : String(n);
const parseArgs = a => { if (a && typeof a === 'object') return a; try { return JSON.parse(a || '{}'); } catch { return {}; } };
const prefixLines = (t, p) => String(t ?? '').split('\n').map(l => p + l).join('\n');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ============================ state ============================ */
const S = {
  conn: store.get('conn', { url: '', key: '' }),
  models: [], running: {}, model: store.get('model', null),
  settings: Object.assign({ temperature: 0.2, num_ctx: 16384, think: 'auto', maxSteps: 25, perm: 'ask' }, store.get('settings', {})),
  agents: [], agentId: store.get('agent', 'build'),
  sessions: store.get('sessions', []), sid: store.get('sid', null),
  fs: null, openFile: null, busy: false, abort: null, stats: null, started: false,
};
const saveSettings = () => store.set('settings', S.settings);

/* ============================ api ============================ */
const base = () => S.conn.url.trim().replace(/\/+$/, '').replace(/\/api$/, '');
async function api(path, body, signal) {
  const hd = {};
  if (body) hd['content-type'] = 'application/json';
  if (S.conn.key) hd.authorization = 'Bearer ' + S.conn.key;
  const r = await fetch(base() + path, { method: body ? 'POST' : 'GET', headers: hd, body: body ? JSON.stringify(body) : undefined, signal });
  if (!r.ok) { let t = ''; try { t = await r.text(); } catch {} throw new Error(`HTTP ${r.status} ${t || r.statusText}`.slice(0, 400)); }
  return r;
}
async function* ndjson(resp) {
  const rd = resp.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const ls = buf.split('\n'); buf = ls.pop();
    for (const l of ls) if (l.trim()) yield JSON.parse(l);
  }
  if (buf.trim()) yield JSON.parse(buf);
}

/* ============================ views ============================ */
function view(n) {
  for (const id of ['connect', 'models', 'ws']) $('#' + id).hidden = id !== n;
}

/* ============================ connect ============================ */
/* URL history: URLs are always saved locally (keys only when the checkbox is on) */
const urlHist = () => store.get('urls', []);
function rememberUrl(url, key) {
  const l = urlHist().filter(x => x.url !== url);
  l.unshift({ url, key: $('#c-rem').checked ? key : '', t: Date.now() });
  store.set('urls', l.slice(0, 12));
}
function paintRecent() {
  const box = $('#c-recent'), l = urlHist(); box.innerHTML = ''; box.hidden = !l.length;

const SKIP = /(^|\/)(node_modules|\.git|\.next|dist|__pycache__|\.venv|\.DS_Store)(\/|$)/;

}

  async read(p) { if (!(p in this.files)) throw new Error('File not found: ' + p); return this.files[p]; }
  async write(p, c) { if (!p) throw new Error('Empty path'); this.files[p] = c; store.set('vfs', this.files); }
  async del(p) { if (!(p in this.files)) throw new Error('File not found: ' + p); delete this.files[p]; store.set('vfs', this.files); }
}
class DirFS {

    for await (const [name, hd] of dir.entries()) {
      const path = prefix + name; if (SKIP.test(path)) continue;

  }
  async list() { const out = []; await this.walk(this.root, '', out, 0); return out.sort(); }

  async fh(p, create) { const parts = p.split('/'); const name = parts.pop(); return (await this.dir(parts.join('/'), create)).getFileHandle(name, { create }); }
  async read(p) { try { return await (await (await this.fh(p, false)).getFile()).text(); } catch { throw new Error('File not found: ' + p); } }
  async write(p, c) { if (!p) throw new Error('Empty path'); const w = await (await this.fh(p, true)).createWritable(); await w.write(c); await w.close(); }
  async del(p) { const parts = p.split('/'); const name = parts.pop(); try { await (await this.dir(parts.join('/'), false)).removeEntry(name); } catch { throw new Error('File not found: ' + p); } }
}

  const root = {};
  for (const f of files) { let n = root; const parts = f.split('/'); parts.forEach((p, i) => { if (i === parts.length - 1) n[p] = f; else n = (n[p] = typeof n[p] === 'object' ? n[p] : {}); }); }

/* ============================ markdown ============================ */
function md(src) {
  const codes = [];
  src = src.replace(/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:```|$)/g, (_, l, c) => { codes.push(`<pre class="code"><div class="lang"><span>${esc(l || 'text')}</span><button class="copy">copy</button></div><code>${esc(c.replace(/\n$/, ''))}</code></pre>`); return '\u0001' + (codes.length - 1) + '\u0001'; });
  const inl = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = '', para = [], list = null;
  const fp = () => { if (para.length) { html += '<p>' + para.map(inl).join('<br>') + '</p>'; para = []; } };
  const fl = () => { if (list) { html += `<${list.t}>` + list.items.map(i => '<li>' + inl(i) + '</li>').join('') + `</${list.t}>`; list = null; } };
  for (const ln of src.split('\n')) {
    let m;
    if (/^\u0001\d+\u0001$/.test(ln)) { fp(); fl(); html += ln; }
    else if ((m = ln.match(/^(#{1,4})\s+(.*)/))) { fp(); fl(); const n = m[1].length + 1; html += `<h${n}>${inl(m[2])}</h${n}>`; }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { fp(); if (!list || list.t !== 'ul') { fl(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { fp(); if (!list || list.t !== 'ol') { fl(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); }
    else if (/^>\s?/.test(ln)) { fp(); fl(); html += '<blockquote>' + inl(ln.replace(/^>\s?/, '')) + '</blockquote>'; }
    else if (!ln.trim()) { fp(); fl(); }
    else { fl(); para.push(ln); }
  }
  fp(); fl();
  return html.replace(/\u0001(\d+)\u0001/g, (_, i) => codes[i]);
}

function runJS(code, timeout = 10000) {
  return new Promise(res => {
    const src = [
      'const __o=[];const __f=(...a)=>__o.push(a.map(x=>{try{return typeof x==="string"?x:JSON.stringify(x)}catch(e){return String(x)}}).join(" "));',
      'console.log=console.info=console.warn=console.error=__f;',
      'self.onmessage=async e=>{try{const AF=Object.getPrototypeOf(async function(){}).constructor;const r=await new AF(e.data)();',
      'postMessage({out:__o.join("\\n"),ret:r===undefined?undefined:(typeof r==="string"?r:JSON.stringify(r))})}',
      'catch(err){postMessage({out:__o.join("\\n"),err:String(err&&err.stack||err)})}}'
    ].join('');
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const w = new Worker(url);
    const done = v => { clearTimeout(t); w.terminate(); URL.revokeObjectURL(url); res(v); };
    const t = setTimeout(() => done('Error: timed out after ' + timeout / 1000 + 's'), timeout);
    w.onmessage = e => { const { out, ret, err } = e.data; done([out && 'stdout:\n' + out, ret !== undefined && 'return: ' + ret, err && 'Error: ' + err].filter(Boolean).join('\n') || '(no output)'); };
    w.onerror = e => done('Error: ' + e.message);
    w.postMessage(code);
  });
}

/* ============================ agent loop ============================ */
const wire = m => { const o = { role: m.role, content: m.content ?? '' }; if (m.images) o.images = m.images; if (m.tool_calls) o.tool_calls = m.tool_calls; if (m.thinking && m.tool_calls) o.thinking = m.thinking; if (m.tool_name) o.tool_name = m.tool_name; return o; };

  let rules = ''; try { rules = (await S.fs.read('AGENTS.md')).slice(0, 4000); } catch {}
  return `${agent.prompt}\n\n# Environment\nWorkspace: ${S.fs.label}\nDate: ${new Date().toDateString()}\nAll paths are relative to the workspace root and use "/" separators.\n\n# Workspace files\n${tree || '(empty)'}${rules ? `\n\n# Project rules (AGENTS.md)\n${rules}` : ''}`;
}

/* ============================ modals ============================ */
function modal(content) {
  const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) m.remove(); } }, h('div', { class: 'mbox' }, content));
  document.body.append(m); return m;
}
function openSettings() {
  const s = S.settings;
  const f = (label, el) => h('label', { class: 'fld' }, label, el);
  const temp = h('input', { type: 'number', step: '0.1', min: '0', max: '2', value: s.temperature });
  const ctx = h('input', { type: 'number', step: '1024', min: '2048', value: s.num_ctx });
  const steps = h('input', { type: 'number', min: '1', max: '100', value: s.maxSteps });
  const think = h('select', {}, ['auto', 'on', 'off'].map(v => h('option', { value: v, selected: v === s.think }, v)));
  const perm = h('select', {}, [['ask', 'Ask before changes'], ['edits', 'Auto-accept edits'], ['auto', 'Auto-accept all']].map(([v, t]) => h('option', { value: v, selected: v === s.perm }, t)));
  const m = modal([h('h3', {}, 'Settings'),
    h('div', { class: 'row2' }, f('Temperature', temp), f('Context window (num_ctx)', ctx)),
    h('div', { class: 'row2' }, f('Max agent steps per run', steps), f('Thinking (thinking-capable models)', think)),
    f('Permissions', perm),
    h('div', { class: 'dim small' }, 'Larger num_ctx uses more memory but helps agents that read many files. Agents can override temperature and model in the Agents editor.'),
    h('div', { style: 'display:flex;gap:8px;justify-content:flex-end' }, h('button', { class: 'btn', onclick: () => m.remove() }, 'Cancel'),
      h('button', { class: 'btn primary', onclick: () => { Object.assign(S.settings, { temperature: +temp.value, num_ctx: +ctx.value || 16384, maxSteps: +steps.value || 25, think: think.value, perm: perm.value }); saveSettings(); updateTop(); m.remove(); } }, 'Save'))]);
}
$('#b-set').addEventListener('click', openSettings);
function openAgents() {
  const m = modal([]); const box = m.firstChild;
  const list = () => {
    box.innerHTML = '';
    box.append(h('h3', {}, 'Agents'), h('div', { class: 'dim small' }, 'Primary agents are the ones you chat with (Tab switches). Subagents are delegated to by primary agents through the task tool.'));
    S.agents.forEach(a => box.append(h('div', { class: 'arow' }, h('div', {}, h('b', {}, a.name), ' ', h('span', { class: 'tag unk' }, a.mode), a.builtin ? h('span', { class: 'tag unk' }, 'built-in') : null, h('div', { class: 'dim small' }, (a.desc || '') + ' · tools: ' + (a.tools || []).join(', '))),
      h('button', { class: 'btn sm', onclick: () => form(a.builtin ? { ...a, id: '', name: a.name + '-copy', builtin: false } : a) }, a.builtin ? 'Duplicate' : 'Edit'))));
    box.append(h('div', { style: 'display:flex;gap:8px;justify-content:space-between' }, h('button', { class: 'btn', onclick: () => form(null) }, '+ New agent'), h('button', { class: 'btn', onclick: () => m.remove() }, 'Close')));
  };
  const form = a => {
    const isNew = !a || !a.id; a = a || { mode: 'primary', tools: ['list_files', 'read_file', 'grep'], prompt: '' };
    const name = h('input', { value: a.name || '', placeholder: 'e.g. reviewer' }), desc = h('input', { value: a.desc || '', placeholder: 'One-line description (shown to the model for subagents)' });
    const mode = h('select', {}, ['primary', 'subagent'].map(v => h('option', { value: v, selected: v === a.mode }, v)));
    const model = h('select', {}, [h('option', { value: '' }, '(use selected model)'), ...S.models.map(x => h('option', { value: x.name, selected: x.name === a.model }, x.name + ((x.caps || []).includes('tools') ? '' : '  [no tools]')))]);
    const temp = h('input', { type: 'number', step: '0.1', min: '0', max: '2', value: a.temperature ?? '', placeholder: 'default' });
    const checks = toolNames().map(n => h('label', {}, h('input', { type: 'checkbox', value: n, checked: (a.tools || []).includes(n) }), n));
    const prompt = h('textarea', { rows: 9, placeholder: 'System prompt: who the agent is, how it should work, how it should report.' }); prompt.value = a.prompt || '';
    box.innerHTML = '';
    box.append(h('h3', {}, isNew ? 'New agent' : 'Edit ' + a.name),
      h('div', { class: 'row2' }, h('label', { class: 'fld' }, 'Name', name), h('label', { class: 'fld' }, 'Mode', mode)),
      h('label', { class: 'fld' }, 'Description', desc),
      h('div', { class: 'row2' }, h('label', { class: 'fld' }, 'Model', model), h('label', { class: 'fld' }, 'Temperature', temp)),
      h('div', { class: 'fld' }, 'Tools', h('div', { class: 'checks' }, checks)),
      h('label', { class: 'fld' }, 'System prompt', prompt),
      h('div', { style: 'display:flex;gap:8px;justify-content:space-between' },
        h('div', {}, !isNew ? h('button', { class: 'btn danger', onclick: () => { store.set('agents', store.get('agents', []).filter(x => x.id !== a.id)); rebuildAgents(); paintPills(); list(); } }, 'Delete') : null),
        h('div', { style: 'display:flex;gap:8px' }, h('button', { class: 'btn', onclick: list }, 'Back'),
          h('button', { class: 'btn primary', onclick: () => {
            const nm = name.value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-|-$/g, ''); if (!nm) return toast('Name required');
            const all = store.get('agents', []); const id = isNew ? nm : a.id;
            if ((isNew && (BUILTIN.some(b => b.id === id) || all.some(x => x.id === id)))) return toast('An agent with that name exists');
            const obj = { id, name: nm, mode: mode.value, desc: desc.value.trim(), model: model.value || undefined, temperature: temp.value === '' ? undefined : +temp.value, tools: checks.filter(c => c.firstChild.checked).map(c => c.firstChild.value), prompt: prompt.value };
            store.set('agents', [...all.filter(x => x.id !== id), obj]); rebuildAgents(); paintPills(); updateStatus(); list();
          } }, 'Save'))));
  };
  list();
}
$('#b-agents').addEventListener('click', openAgents);

/* ============================ boot ============================ */
function enterWorkspace() {
  S.started = true;
  if (!S.sessions.length) S.sessions.push(mkSession());
  if (!cur()) S.sid = S.sessions[0].id;
  view('ws'); $('#srv').textContent = base();
  paintPills(); paintSessions(); renderSession(); updateTop(); refreshFiles();
  $('#inp').focus();
}
view('connect');
</script>
</body>
